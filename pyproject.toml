[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toronto-postcard"
version = "0.1.0"
description = "A Mac publisher and restricted Pi receiver for a calendar/weather e-ink postcard"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13", "requests>=2.34.2,<3", "icalendar>=7.3,<8", "recurring-ical-events>=3.8.2,<4"]

[project.scripts]
toronto-postcard = "toronto_postcard.publisher:main"

[tool.setuptools.packages.find]
include = ["toronto_postcard*"]
