name: Tests and dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install reviewed dependencies
        run: |
          python -m pip --isolated install --upgrade pip==26.2.1
          python -m pip --isolated install --require-hashes -r requirements.lock.txt
          python -m pip --isolated install pip-audit==2.10.1
      - name: Run behavior and security tests
        run: python -m unittest discover -s tests -v
      - name: Audit publisher dependencies
        run: pip-audit --disable-pip --no-deps -r requirements.lock.txt
